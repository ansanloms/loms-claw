name: claude-workspace
version: 1.0.0
description: APM project for claude-workspace
author: ansanloms
dependencies:
  apm:
    - ansanloms/skills/find-docs
    - ansanloms/skills/yamareco
    - ansanloms/skills/discord
    - ansanloms/skills/jartic-traffic-jam-forecast
    - ansanloms/skills/jartic-traffic-volume
    - ansanloms/skills/bluesky
    - ansanloms/skills/news-digest
    - ansanloms/skills/mountain-weather
    - ansanloms/skills/google-health
  mcp: []
includes: auto
scripts: {}
lifecycle:
  post-install:
  - type: command
    description: npm ci
    command: 'rc=0; for d in .claude/skills/*/scripts; do [ -f "$d/package-lock.json" ] || continue; node -e ''const p=require(process.argv[1]);process.exit(Object.keys(p.dependencies||{}).length?0:1)'' "$PWD/$d/package.json" || continue; echo "npm ci: $d"; npm ci --omit=dev --prefix "$d" || rc=1; done; exit $rc'
    timeoutSec: 300
