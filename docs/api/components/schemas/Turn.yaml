type: object
description: ターン。依頼 1 件の処理の単位。
required:
  - id
  - threadId
  - status
  - source
properties:
  id:
    type: string
    description: ターン ID。スレッドをまたいで一意。
  threadId:
    type: string
    description: client が決めるスレッド ID。不透明な文字列として扱う。
  status:
    $ref: ./EnumTurnStatus.yaml
  source:
    type: string
    description: 本体が token から引いた依頼の出所。`user` の token の依頼は `client:<token の名前>`、`agent` のうちターンが起点の依頼は `turn:<turnId>`、定期実行タスクが起点の依頼は `scheduled-task:<taskId>`。
