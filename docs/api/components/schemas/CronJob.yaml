type: object
description: 登録済み cron ジョブ。
required:
  - name
  - schedule
  - kind
properties:
  name:
    type: string
    description: ジョブ名。ファイル名から決定する。
  kind:
    type: string
    enum:
      - prompt
      - command
    description: ジョブの種別。prompt は本文を Claude に渡す `.md`、command は `sh -c` で実行する `.yaml`。
  schedule:
    type: string
    description: cron 式。5 フィールド、TZ 環境変数に依存する。
    example: 0 9 * * *
  channelId:
    type: string
    description: 結果の自動投稿先チャンネル ID。未指定のジョブでは省略される。
  once:
    type: boolean
    description: 1 回実行後にジョブファイルを自動削除するか。
