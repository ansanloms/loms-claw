type: object
description: AskUserQuestion の 1 質問。
required:
  - question
  - header
  - options
  - multiSelect
properties:
  question:
    type: string
    description: 質問文。
  header:
    type: string
    description: 質問の見出し。
  options:
    type: array
    maxItems: 24
    description: 選択肢。24 件まで。自由入力は client が足す。
    items:
      $ref: ./QuestionOption.yaml
  multiSelect:
    type: boolean
    description: 複数選択を許すか。
