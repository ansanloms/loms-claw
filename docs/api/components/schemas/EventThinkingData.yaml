type: object
description: Claude の推論 (thinking) のテキスト。本体は常に流し、見せるかどうかは client が決める。
required:
  - threadId
  - turnId
  - text
properties:
  threadId:
    type: string
    description: client が決めるスレッド ID。不透明な文字列として扱う。
  turnId:
    type: string
    description: ターン ID。
  text:
    type: string
    description: 推論のテキスト。
