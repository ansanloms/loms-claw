type: object
description: ターンの作成リクエスト。
additionalProperties: false
required:
  - prompt
properties:
  prompt:
    type: string
    minLength: 1
    pattern: \S
    description: 対象のスレッドへ渡す依頼の本文。空白以外を 1 文字以上含むこと。
  model:
    type: string
    minLength: 1
    description: このターンで使うモデルの alias またはフルネーム。省くと本体の既定値を使う。
    example: claude-sonnet-4-6
  effort:
    $ref: ./EnumEffort.yaml
