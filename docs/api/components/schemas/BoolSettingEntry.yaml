type: object
description: boolean 設定値とその出所。
required:
  - value
  - source
properties:
  value:
    type: boolean
    description: 解決された設定値。
    example: false
  source:
    type: string
    description: 値の出所。thread はスレッド固有値、channel は親チャンネル値、default はグローバルデフォルト値を表す。
    enum:
      - thread
      - channel
      - default
    example: default
