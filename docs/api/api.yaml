openapi: 3.2.1
info:
  version: 0.2.0
  title: loms-claw API
  description:
    $ref: ./README.md
servers:
  - url: http://127.0.0.1:3000
    description: ローカルの API サーバ (apiPort 既定値 3000)。
tags:
  - name: approvals
    description: 保留中のツール承認の一覧取得と回答。
  - name: scheduled-tasks
    description: 定期実行タスクの一覧取得・手動実行・再読み込み。
  - name: events
    description: SSE によるイベントの購読。
  - name: logs
    description: メモリ上のリングバッファからのログ取得。
  - name: permissions
    description: 常時許可の取得・置き換え。
  - name: questions
    description: 保留中の質問 (AskUserQuestion) の一覧取得と回答。
  - name: threads
    description: スレッドの登録・取得とセッションの破棄。
  - name: turns
    description: ターンの作成・一覧の取得・中止。
security:
  - bearerAuth:
      - user
  - bearerAuth:
      - agent
paths:
  /approvals:
    $ref: ./paths/approvals.yaml
  /approvals/{approvalId}:
    $ref: ./paths/approvals.{approvalId}.yaml
  /events:
    $ref: ./paths/events.yaml
  /logs:
    $ref: ./paths/logs.yaml
  /permissions/allow:
    $ref: ./paths/permissions.allow.yaml
  /questions:
    $ref: ./paths/questions.yaml
  /questions/{questionId}:
    $ref: ./paths/questions.{questionId}.yaml
  /scheduled-tasks:
    $ref: ./paths/scheduled-tasks.yaml
  /scheduled-tasks/reload:
    $ref: ./paths/scheduled-tasks.reload.yaml
  /scheduled-tasks/{taskId}/run:
    $ref: ./paths/scheduled-tasks.{taskId}.run.yaml
  /threads/{threadId}:
    $ref: ./paths/threads.{threadId}.yaml
  /threads/{threadId}/session:
    $ref: ./paths/threads.{threadId}.session.yaml
  /threads/{threadId}/turns:
    $ref: ./paths/threads.{threadId}.turns.yaml
  /turns/{turnId}:
    $ref: ./paths/turns.{turnId}.yaml
components:
  schemas:
    Approval:
      $ref: ./components/schemas/Approval.yaml
    EventApprovalResolvedData:
      $ref: ./components/schemas/EventApprovalResolvedData.yaml
    EventErrorData:
      $ref: ./components/schemas/EventErrorData.yaml
    EventProgressData:
      $ref: ./components/schemas/EventProgressData.yaml
    EventQuestionResolvedData:
      $ref: ./components/schemas/EventQuestionResolvedData.yaml
    EventReplyData:
      $ref: ./components/schemas/EventReplyData.yaml
    EventScheduledTaskErrorData:
      $ref: ./components/schemas/EventScheduledTaskErrorData.yaml
    EventScheduledTaskOutputData:
      $ref: ./components/schemas/EventScheduledTaskOutputData.yaml
    EventThinkingData:
      $ref: ./components/schemas/EventThinkingData.yaml
    EventTurnEndedData:
      $ref: ./components/schemas/EventTurnEndedData.yaml
    EventTurnQueuedData:
      $ref: ./components/schemas/EventTurnQueuedData.yaml
    EventTurnStartedData:
      $ref: ./components/schemas/EventTurnStartedData.yaml
    LogEntry:
      $ref: ./components/schemas/LogEntry.yaml
    PendingQuestion:
      $ref: ./components/schemas/PendingQuestion.yaml
    Question:
      $ref: ./components/schemas/Question.yaml
    QuestionOption:
      $ref: ./components/schemas/QuestionOption.yaml
    ScheduledTask:
      $ref: ./components/schemas/ScheduledTask.yaml
    Thread:
      $ref: ./components/schemas/Thread.yaml
    Turn:
      $ref: ./components/schemas/Turn.yaml
    EnumApprovalDecision:
      $ref: ./components/schemas/EnumApprovalDecision.yaml
    EnumApprovalOutcome:
      $ref: ./components/schemas/EnumApprovalOutcome.yaml
    EnumEffort:
      $ref: ./components/schemas/EnumEffort.yaml
    EnumQuestionOutcome:
      $ref: ./components/schemas/EnumQuestionOutcome.yaml
    EnumTurnResult:
      $ref: ./components/schemas/EnumTurnResult.yaml
    EnumTurnStatus:
      $ref: ./components/schemas/EnumTurnStatus.yaml
    RequestPostApprovalsApprovalId:
      $ref: ./components/schemas/RequestPostApprovalsApprovalId.yaml
    RequestPostQuestionsQuestionId:
      $ref: ./components/schemas/RequestPostQuestionsQuestionId.yaml
    RequestPostThreadsThreadIdTurns:
      $ref: ./components/schemas/RequestPostThreadsThreadIdTurns.yaml
    RequestPutPermissionsAllow:
      $ref: ./components/schemas/RequestPutPermissionsAllow.yaml
    ResponseDeleteTurnsTurnId:
      $ref: ./components/schemas/ResponseDeleteTurnsTurnId.yaml
    ResponseError:
      $ref: ./components/schemas/ResponseError.yaml
    ResponseGetApprovals:
      $ref: ./components/schemas/ResponseGetApprovals.yaml
    ResponseGetEvents:
      $ref: ./components/schemas/ResponseGetEvents.yaml
    ResponseGetLogs:
      $ref: ./components/schemas/ResponseGetLogs.yaml
    ResponseGetPermissionsAllow:
      $ref: ./components/schemas/ResponseGetPermissionsAllow.yaml
    ResponseGetQuestions:
      $ref: ./components/schemas/ResponseGetQuestions.yaml
    ResponseGetScheduledTasks:
      $ref: ./components/schemas/ResponseGetScheduledTasks.yaml
    ResponseGetThreadsThreadIdTurns:
      $ref: ./components/schemas/ResponseGetThreadsThreadIdTurns.yaml
    ResponsePostScheduledTasksReload:
      $ref: ./components/schemas/ResponsePostScheduledTasksReload.yaml
    ResponsePostScheduledTasksTaskIdRun:
      $ref: ./components/schemas/ResponsePostScheduledTasksTaskIdRun.yaml
    ResponsePutPermissionsAllow:
      $ref: ./components/schemas/ResponsePutPermissionsAllow.yaml
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token。ロールは `user` と `agent` の 2 つで、token から本体が引く。`user` は利用者 (が使う client) の token で、全 operation を呼べる。`agent` はワークスペースの Claude に渡す token で、承認・質問への回答、定期実行タスクの再読み込み、常時許可の置き換え、ターンの中止を呼べない (403)。ロール名は定義に宣言する場所が無いので、意味は README が定義する。
