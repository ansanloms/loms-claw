openapi: 3.1.0
info:
  version: 0.0.1
  title: loms-claw Internal API
  description:
    $ref: ./README.md
servers:
  - url: http://127.0.0.1:3000
    description: ローカルの in-process API サーバ (apiPort 既定値 3000)。
tags:
  - name: cron
    description: cron ジョブの一覧取得・手動実行・再読み込み API。
  - name: health
    description: healthcheck 用 API。
  - name: logs
    description: メモリ上のリングバッファからのログ取得 API。
  - name: settings
    description: チャンネル/スレッド単位の設定の取得・更新・削除 API。
paths:
  /cron:
    $ref: ./paths/cron.yaml
  /cron/reload:
    $ref: ./paths/cron.reload.yaml
  /cron/run:
    $ref: ./paths/cron.run.yaml
  /health:
    $ref: ./paths/health.yaml
  /logs:
    $ref: ./paths/logs.yaml
  /settings/default:
    $ref: ./paths/settings.default.yaml
  /settings/{id}:
    $ref: ./paths/settings.{id}.yaml
components:
  schemas:
    BoolSettingEntry:
      $ref: ./components/schemas/BoolSettingEntry.yaml
    CronJob:
      $ref: ./components/schemas/CronJob.yaml
    DefaultSettings:
      $ref: ./components/schemas/DefaultSettings.yaml
    LogEntry:
      $ref: ./components/schemas/LogEntry.yaml
    ScopeSettings:
      $ref: ./components/schemas/ScopeSettings.yaml
    SettingEntry:
      $ref: ./components/schemas/SettingEntry.yaml
    RequestPatchSettings:
      $ref: ./components/schemas/RequestPatchSettings.yaml
    RequestPostCronRun:
      $ref: ./components/schemas/RequestPostCronRun.yaml
    ResponseDeleteSettings:
      $ref: ./components/schemas/ResponseDeleteSettings.yaml
    ResponseError:
      $ref: ./components/schemas/ResponseError.yaml
    ResponseGetCron:
      $ref: ./components/schemas/ResponseGetCron.yaml
    ResponseGetHealth:
      $ref: ./components/schemas/ResponseGetHealth.yaml
    ResponseGetLogs:
      $ref: ./components/schemas/ResponseGetLogs.yaml
    ResponsePostCronReload:
      $ref: ./components/schemas/ResponsePostCronReload.yaml
    ResponsePostCronRun:
      $ref: ./components/schemas/ResponsePostCronRun.yaml
