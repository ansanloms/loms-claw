parameters:
  - in: path
    name: turnId
    required: true
    description: ターン ID。スレッドをまたいで一意。ID はパーセントエンコードして渡す。
    schema:
      type: string
      minLength: 1
delete:
  operationId: deleteTurnsTurnId
  summary: ターンの中止。
  tags:
    - turns
  description:
    $ref: ./descriptions/deleteTurnsTurnId.md
  security:
    - bearerAuth: [user]
  responses:
    202:
      description: 中止を受け付けた場合。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseDeleteTurnsTurnId.yaml
          examples:
            accepted:
              value:
                $ref: ../examples/ResponseDeleteTurnsTurnId/default.yaml
    400:
      description: "`Authorization` ヘッダの形式が不正な場合。"
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            badRequest:
              value:
                $ref: ../examples/ResponseError/default.yaml
    401:
      description: token が無い、または無効な場合。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            unauthorized:
              value:
                $ref: ../examples/ResponseError/default.yaml
    403:
      description: "`agent` の token で呼んだ場合。"
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            forbidden:
              value:
                $ref: ../examples/ResponseError/default.yaml
    404:
      description: 該当するターンが無い場合 (既に終わったターンを含む)。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            notFound:
              value:
                $ref: ../examples/ResponseError/default.yaml
