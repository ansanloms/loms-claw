get:
  operationId: getEvents
  summary: イベントの購読。
  tags:
    - events
  description:
    $ref: ./descriptions/getEvents.md
  parameters:
    - in: query
      name: scopeId
      required: false
      description: このスコープのイベントだけに絞る。省略すると全スコープ。登録されていないスコープを指定すると 404 を返す。scopeId で絞った購読には、scopeId を持たないイベントは流れない。
      schema:
        type: string
  responses:
    200:
      description: 処理成功時。
      content:
        text/event-stream:
          itemSchema:
            $ref: ../components/schemas/ResponseGetEvents.yaml
          examples:
            turnQueued:
              serializedValue: |+
                event: turn.queued
                data: {"scopeId":"1234567890123456789","turnId":"t-0001"}

            turnStarted:
              serializedValue: |+
                event: turn.started
                data: {"scopeId":"1234567890123456789","turnId":"t-0001"}

            reply:
              serializedValue: |+
                event: reply
                data: {"scopeId":"1234567890123456789","turnId":"t-0001","text":"宿まであと 40 km だ。"}

            thinking:
              serializedValue: |+
                event: thinking
                data: {"scopeId":"1234567890123456789","turnId":"t-0001","text":"残りの距離を確かめる。"}

            progress:
              serializedValue: |+
                event: progress
                data: {"scopeId":"1234567890123456789","turnId":"t-0001","toolName":"Bash","elapsedSeconds":12}

            error:
              serializedValue: |+
                event: error
                data: {"scopeId":"1234567890123456789","turnId":"t-0001","message":"API error: 500"}

            turnEnded:
              serializedValue: |+
                event: turn.ended
                data: {"scopeId":"1234567890123456789","turnId":"t-0001","result":"completed"}

            scheduledTaskOutput:
              serializedValue: |+
                event: scheduled-task.output
                data: {"scopeId":"1234567890123456789","taskId":"news.md","text":"今日のニュースは次のとおり。"}

            scheduledTaskError:
              serializedValue: |+
                event: scheduled-task.error
                data: {"scopeId":"1234567890123456789","taskId":"news.md","message":"command failed: exit 1"}

            approvalRequested:
              serializedValue: |+
                event: approval.requested
                data: {"id":"a-0001","scopeId":"1234567890123456789","toolName":"Bash","description":"テストを実行する","input":{"command":"npm test","description":"テストを実行する"},"requestedAt":"2026-11-21T09:00:00Z","expiresAt":"2026-11-21T09:05:00Z"}

            approvalResolved:
              serializedValue: |+
                event: approval.resolved
                data: {"approvalId":"a-0001","scopeId":"1234567890123456789","decision":"allow"}

            questionRequested:
              serializedValue: |+
                event: question.requested
                data: {"id":"q-0001","scopeId":"1234567890123456789","questions":[{"question":"どちらの宿にしますか。","header":"宿","options":[{"label":"駅前","description":"駅から徒歩 3 分。"},{"label":"海沿い","description":"駅から徒歩 20 分。"}],"multiSelect":false}],"requestedAt":"2026-11-21T09:00:00Z","expiresAt":"2026-11-21T09:05:00Z"}

            questionResolved:
              serializedValue: |+
                event: question.resolved
                data: {"questionId":"q-0001","scopeId":"1234567890123456789","result":"answered"}

    404:
      description: scopeId に指定したスコープが登録されていない場合。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            notFound:
              value:
                $ref: ../examples/ResponseError/default.yaml
