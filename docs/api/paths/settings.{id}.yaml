parameters:
  - in: path
    name: id
    required: true
    description: スコープを表す ID。チャンネル ID/スレッド ID (Discord Snowflake) のいずれか、または cron の擬似 ID `cron:{name}` を指定する。id がスレッドか通常チャンネルかはサーバが判定するため、利用者は対象の ID をそのまま渡せばよい。
    schema:
      type: string
    example: "1234567890123456789"
get:
  operationId: getSettings
  summary: スコープ設定の取得。
  tags:
    - settings
  description: 指定スコープの解決済み設定を取得する。id がスレッドか通常チャンネルかはサーバが判定し、スレッドであれば親チャンネルへのフォールバックを含めて解決する。呼び出し側が親子関係を意識する必要はない。
  responses:
    200:
      description: 処理成功時。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ScopeSettings.yaml
          examples:
            succeeded:
              value:
                $ref: ../examples/ResponseGetSettings.yaml
patch:
  operationId: patchSettings
  summary: スコープ設定の部分更新。
  tags:
    - settings
  description: 指定スコープの設定を JSON Merge Patch (RFC 7386) の意味論で部分更新する。スレッドを対象にする場合は id にスレッド ID をそのまま渡せばよい。書き込みは常に id 自身に対して行われるため、それだけで正しくそのスレッドのスコープへ書き込まれる。レスポンスは書き込み後にサーバが解決した実効設定であり、id がスレッドであれば親チャンネルへのフォールバックを含む。
  requestBody:
    required: true
    description: 更新内容。
    content:
      application/json:
        schema:
          $ref: ../components/schemas/RequestPatchSettings.yaml
        examples:
          normal:
            value:
              $ref: ../examples/RequestPatchSettings.yaml
  responses:
    200:
      description: 処理成功時。更新後にサーバが解決した実効設定を返す。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ScopeSettings.yaml
          examples:
            succeeded:
              value:
                $ref: ../examples/ResponsePatchSettings.yaml
    400:
      description: リクエストボディがスキーマに適合しない場合。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            badRequest:
              value:
                $ref: ../examples/ResponseError.yaml
delete:
  operationId: deleteSettings
  summary: スコープ設定の削除。
  tags:
    - settings
  description: 指定スコープの設定を全削除する。スレッドを対象にする場合は id にスレッド ID をそのまま渡せばよい。削除は常に id 自身に対して行われるため、消えるのは id 配下のキーのみであり、親チャンネルの設定は残る。
  responses:
    200:
      description: 処理成功時。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseDeleteSettings.yaml
          examples:
            succeeded:
              value:
                $ref: ../examples/ResponseDeleteSettings.yaml
