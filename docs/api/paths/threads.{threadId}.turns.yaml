parameters:
  - in: path
    name: threadId
    required: true
    description: client が決めるスレッド ID。不透明な文字列として扱う。ID はパーセントエンコードして渡す。
    schema:
      type: string
      minLength: 1
    example: "1234567890123456789"
post:
  operationId: postThreadsThreadIdTurns
  summary: ターンの作成。
  tags:
    - turns
  description:
    $ref: ./descriptions/postThreadsThreadIdTurns.md
  requestBody:
    required: true
    description: 依頼の本文と、任意のモデル・effort。
    content:
      application/json:
        schema:
          $ref: ../components/schemas/RequestPostThreadsThreadIdTurns.yaml
        examples:
          normal:
            value:
              $ref: ../examples/RequestPostThreadsThreadIdTurns/default.yaml
  responses:
    202:
      description: 依頼を対象スレッドのキューに積んだ場合。処理の完了は待たない。作ったターンを返す。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Turn.yaml
          examples:
            accepted:
              value:
                $ref: ../examples/Turn/default.yaml
    400:
      description: JSON が不正、またはスキーマに適合しない場合。`Authorization` ヘッダの形式が不正な場合も含む。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            badRequest:
              value:
                $ref: ../examples/ResponseError/default.yaml
    401:
      description: token が無い、または無効な場合。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            unauthorized:
              value:
                $ref: ../examples/ResponseError/default.yaml
    404:
      description: スレッドが登録されていない場合。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            notFound:
              value:
                $ref: ../examples/ResponseError/default.yaml
    429:
      description: "`agent` の依頼がレート制限を超過した場合 (bot 全体で直近 10 分に 6 回まで。自己メンションとは別枠)。`user` の依頼には掛からない。"
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            rateLimited:
              value:
                $ref: ../examples/ResponseError/default.yaml
    503:
      description: 依頼の機能が無効な場合、または bot が終了処理中の場合。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            unavailable:
              value:
                $ref: ../examples/ResponseError/default.yaml
get:
  operationId: getThreadsThreadIdTurns
  summary: ターンの一覧の取得。
  tags:
    - turns
  description:
    $ref: ./descriptions/getThreadsThreadIdTurns.md
  responses:
    200:
      description: 処理成功時。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseGetThreadsThreadIdTurns.yaml
          examples:
            succeeded:
              value:
                $ref: ../examples/ResponseGetThreadsThreadIdTurns/default.yaml
    400:
      description: "`Authorization` ヘッダの形式が不正な場合。"
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            badRequest:
              value:
                $ref: ../examples/ResponseError/default.yaml
    401:
      description: token が無い、または無効な場合。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            unauthorized:
              value:
                $ref: ../examples/ResponseError/default.yaml
    404:
      description: スレッドが登録されていない場合。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            notFound:
              value:
                $ref: ../examples/ResponseError/default.yaml
