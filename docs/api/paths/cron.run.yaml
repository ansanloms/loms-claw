post:
  operationId: postCronRun
  summary: cron ジョブの手動実行。
  tags:
    - cron
  description: 名前を指定して登録済みジョブを即座に実行する。
  requestBody:
    description: 実行対象のジョブ名。
    content:
      application/json:
        schema:
          $ref: ../components/schemas/RequestPostCronRun.yaml
        examples:
          normal:
            value:
              $ref: ../examples/RequestPostCronRun.yaml
  responses:
    200:
      description: ジョブの実行が終わった場合。成否は result で判断する。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponsePostCronRun.yaml
          examples:
            succeeded:
              value:
                $ref: ../examples/ResponsePostCronRun.yaml
    400:
      description: name が指定されていない場合。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            badRequest:
              value:
                $ref: ../examples/ResponseError.yaml
    404:
      description: 指定したジョブが存在しない場合。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            notFound:
              value:
                $ref: ../examples/ResponseError.yaml
    429:
      description: 手動実行のレート制限を超過した場合 (bot 全体で直近 10 分に 6 回まで。自己メンション・セッション間の依頼とは別枠)。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            rateLimited:
              value:
                $ref: ../examples/ResponseError.yaml
    500:
      description: ルート内で想定外の例外が起きた場合 (onError)。ジョブの失敗では返らない。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            processingFailed:
              value:
                $ref: ../examples/ResponseError.yaml
    503:
      description: cron 機能が無効な場合。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            unavailable:
              value:
                $ref: ../examples/ResponseError.yaml
