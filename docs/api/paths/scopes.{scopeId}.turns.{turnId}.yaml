parameters:
  - in: path
    name: scopeId
    required: true
    description: client が決めるスコープ ID。不透明な文字列として扱う。
    schema:
      type: string
    example: "1234567890123456789"
  - in: path
    name: turnId
    required: true
    description: ターン ID。
    schema:
      type: string
delete:
  operationId: deleteScopesScopeIdTurnsTurnId
  summary: ターンの中止。
  tags:
    - turns
  description:
    $ref: ./descriptions/deleteScopesScopeIdTurnsTurnId.md
  responses:
    202:
      description: 中止を受け付けた場合。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseDeleteScopesScopeIdTurnsTurnId.yaml
          examples:
            accepted:
              value:
                $ref: ../examples/ResponseDeleteScopesScopeIdTurnsTurnId/default.yaml
    404:
      description: スコープが登録されていない場合、または該当するターンが無い場合 (既に終わったターンを含む)。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            notFound:
              value:
                $ref: ../examples/ResponseError/default.yaml
