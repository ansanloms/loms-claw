parameters:
  - in: path
    name: taskId
    required: true
    description: 実行するタスクの ID (例 news.md)。ID はパーセントエンコードして渡す。
    schema:
      type: string
      minLength: 1
post:
  operationId: postScheduledTasksTaskIdRun
  summary: 定期実行タスクの手動実行。
  tags:
    - scheduled-tasks
  description:
    $ref: ./descriptions/postScheduledTasksTaskIdRun.md
  responses:
    202:
      description: タスクの実行を受け付けた場合。完了は待たない。prompt 型では作ったターンを返す。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponsePostScheduledTasksTaskIdRun.yaml
          examples:
            accepted:
              value:
                $ref: ../examples/ResponsePostScheduledTasksTaskIdRun/default.yaml
    400:
      description: "`Authorization` ヘッダの形式が不正な場合。"
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            badRequest:
              value:
                $ref: ../examples/ResponseError/default.yaml
    401:
      description: token が無い、または無効な場合。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            unauthorized:
              value:
                $ref: ../examples/ResponseError/default.yaml
    404:
      description: 指定したタスクが存在しない場合。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            notFound:
              value:
                $ref: ../examples/ResponseError/default.yaml
    409:
      description: "`enabled` が false のタスクを指定した場合、または command 型のタスクが実行中の場合。"
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            conflict:
              value:
                $ref: ../examples/ResponseError/default.yaml
    429:
      description: "`agent` の手動実行がレート制限を超過した場合 (ターンの作成と同じ枠で、bot 全体で直近 10 分に 6 回まで)。`user` の手動実行には掛からない。"
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            rateLimited:
              value:
                $ref: ../examples/ResponseError/default.yaml
    500:
      description: ルート内で想定外の例外が起きた場合。タスクの失敗では返らない。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            processingFailed:
              value:
                $ref: ../examples/ResponseError/default.yaml
    503:
      description: 定期実行機能が無効な場合。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            unavailable:
              value:
                $ref: ../examples/ResponseError/default.yaml
