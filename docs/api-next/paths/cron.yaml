get:
  operationId: getCron
  summary: cron ジョブ一覧の取得。
  tags:
    - cron
  description:
    $ref: ./descriptions/getCron.md
  responses:
    200:
      description: 処理成功時。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseGetCron.yaml
          examples:
            succeeded:
              value:
                $ref: ../examples/ResponseGetCron/default.yaml
    401:
      description: token が無い、または誤っている場合。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            unauthorized:
              value:
                $ref: ../examples/ResponseError/default.yaml
    503:
      description: cron 機能が無効な場合。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            unavailable:
              value:
                $ref: ../examples/ResponseError/default.yaml
