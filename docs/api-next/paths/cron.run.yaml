post:
  operationId: postCronRun
  summary: cron ジョブの手動実行。
  tags:
    - cron
  description:
    $ref: ./descriptions/postCronRun.md
  requestBody:
    required: true
    description: 実行対象のジョブ名。
    content:
      application/json:
        schema:
          $ref: ../components/schemas/RequestPostCronRun.yaml
        examples:
          normal:
            value:
              $ref: ../examples/RequestPostCronRun/default.yaml
  responses:
    200:
      description: ジョブの実行が終わった場合。成否は result で判断する。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponsePostCronRun.yaml
          examples:
            succeeded:
              value:
                $ref: ../examples/ResponsePostCronRun/default.yaml
    400:
      description: name が指定されていない場合。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            badRequest:
              value:
                $ref: ../examples/ResponseError/default.yaml
    401:
      description: token が無い、または誤っている場合。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            unauthorized:
              value:
                $ref: ../examples/ResponseError/default.yaml
    404:
      description: 指定したジョブが存在しない場合。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            notFound:
              value:
                $ref: ../examples/ResponseError/default.yaml
    500:
      description: ルート内で想定外の例外が起きた場合。ジョブの失敗では返らない。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            processingFailed:
              value:
                $ref: ../examples/ResponseError/default.yaml
    503:
      description: cron 機能が無効な場合。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            unavailable:
              value:
                $ref: ../examples/ResponseError/default.yaml
