parameters:
  - in: path
    name: approvalId
    required: true
    description: 承認 ID。
    schema:
      type: string
post:
  operationId: postApprovalsApprovalId
  summary: 承認への回答。
  tags:
    - approvals
  description:
    $ref: ./descriptions/postApprovalsApprovalId.md
  requestBody:
    required: true
    description: 承認への答え。
    content:
      application/json:
        schema:
          $ref: ../components/schemas/RequestPostApprovalsApprovalId.yaml
        examples:
          normal:
            value:
              $ref: ../examples/RequestPostApprovalsApprovalId/default.yaml
  responses:
    200:
      description: 答えを受け付けた場合。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponsePostApprovalsApprovalId.yaml
          examples:
            succeeded:
              value:
                $ref: ../examples/ResponsePostApprovalsApprovalId/default.yaml
    400:
      description: JSON が不正、またはスキーマに適合しない場合。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            badRequest:
              value:
                $ref: ../examples/ResponseError/default.yaml
    401:
      description: token が無い、または誤っている場合。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            unauthorized:
              value:
                $ref: ../examples/ResponseError/default.yaml
    403:
      description: agent の token で呼んだ場合。承認系は利用者の token だけが呼べる。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            forbidden:
              value:
                $ref: ../examples/ResponseError/default.yaml
    404:
      description: 承認が存在しない場合。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            notFound:
              value:
                $ref: ../examples/ResponseError/default.yaml
    409:
      description: 承認が既に解決済み (時間切れを含む) の場合。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            conflict:
              value:
                $ref: ../examples/ResponseError/default.yaml
