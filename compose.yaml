name: loms-claw

services:
  bot:
    build: .
    environment:
      TZ: ${TZ:-Asia/Tokyo}
    volumes:
      - type: bind
        source: ./data
        target: /data
    healthcheck:
      # $ はコンテナ内の shell に評価させるため $$ でエスケープする (compose の変数展開はホスト側で行われる)。
      # apiPort 省略時は config.schema.json の既定値 3000 を使う (config.ts は defaults 補完後に検証するため省略が通る)。
      # jq が失敗 (config 不正・欠落) または port が空なら curl を呼ばず unhealthy にする。
      # jq のエラーメッセージは docker inspect の Health.Log[].Output で読める。
      test:
        [
          "CMD-SHELL",
          "port=$$(jq -r '.claude.apiPort // 3000' $${LOMS_CLAW_CONFIG:-/data/config.json}) && [ -n \"$$port\" ] && curl -fsS \"http://127.0.0.1:$$port/health\" || exit 1",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    # bot/mod.ts の shutdown() は apiServer.shutdown() / client.destroy() に
    # それぞれ最大 5 秒 (SHUTDOWN_TIMEOUT_MS) を許容するため、合計最大 10 秒
    # かかり得る。Docker の既定 stop_grace_period (10s) では SIGKILL が
    # 先に飛ぶ余地があるため、余裕を持たせて 15s にする。
    stop_grace_period: 15s
