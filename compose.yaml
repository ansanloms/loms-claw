name: loms-claw

services:
  bot:
    build: .
    environment:
      TZ: ${TZ:-Asia/Tokyo}
    volumes:
      - type: bind
        source: ./data
        target: /data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:$(jq -r .claude.apiPort ${LOMS_CLAW_CONFIG:-/data/config.json})/health || exit 1",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
