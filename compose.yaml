name: loms-claw

services:
  bot:
    build: .
    environment:
      TZ: ${TZ:-Asia/Tokyo}
    volumes:
      - type: bind
        source: ./data
        target: /data
    healthcheck:
      # $ はコンテナ内の shell に評価させるため $$ でエスケープする (compose の変数展開はホスト側で行われる)。
      # apiPort 省略時は config.schema.json の既定値 3000 を使う (config.ts は defaults 補完後に検証するため省略が通る)。
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:$$(jq -r '.claude.apiPort // 3000' $${LOMS_CLAW_CONFIG:-/data/config.json})/health || exit 1",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
