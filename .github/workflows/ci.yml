# DENO_VERSION は Dockerfile のベースイメージと揃えること。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DENO_VERSION: "2.9.5"

jobs:
  root:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Type check
        run: deno task check

      - name: Lint
        run: deno task lint

      - name: Test
        run: deno task test

  generated:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Regenerate api/internal-schemas.ts
        run: deno task generate

      - name: Check generated file is up to date
        run: git diff --exit-code -- api/internal-schemas.ts

  docs-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Install dependencies
        run: deno install
        working-directory: ./docs/api

      - name: Lint
        run: deno task --cwd ./docs/api lint

      - name: Type check
        run: deno task --cwd ./docs/api check
