name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - next

permissions: {}

jobs:
  root:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Install docs/api dependencies
        run: npm --prefix docs/api ci
      - name: Generate
        run: npm run generate
      - name: Diff generated files
        run: git diff --exit-code -- packages/server/api/openapi.gen.json packages/server/api/openapi.gen.d.ts

  docs-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
        working-directory: docs/api
      - name: Lint
        run: npm run lint
        working-directory: docs/api
      - name: Test
        run: npm test
        working-directory: docs/api

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build .
