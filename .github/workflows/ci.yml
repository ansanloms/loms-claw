# DENO_VERSION は Dockerfile の `denoland/deno:bin-*` タグと揃えること。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DENO_VERSION: "2.9.7"
  NODE_VERSION: "24"

jobs:
  root:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  generated:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Regenerate api/internal-schemas.ts
        run: npm run generate

      - name: Check generated file is up to date
        run: git diff --exit-code -- api/internal-schemas.ts

  docs-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Install dependencies
        run: deno install
        working-directory: ./docs/api

      - name: Lint
        run: deno task --cwd ./docs/api lint

      - name: Type check
        run: deno task --cwd ./docs/api check
