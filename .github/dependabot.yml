version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "build"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # docs/api は独自の package.json / package-lock.json を持ち、ルートの
  # package.json からは参照されない。エントリを分けないと追従されず、テンプレート
  # (ansanloms/openapi-template) との差が開き続ける。
  # git 依存の自前 3 パッケージ (@ansanloms/*) は、dependabot の更新 PR が来な
  # ければ手動で上げる。
  - package-ecosystem: "npm"
    directory: "/docs/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "build"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "build"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "ci"
